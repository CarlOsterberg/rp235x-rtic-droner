[package]
edition = "2024"
name = "rp235x-rtic-droner"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
embedded-hal = { version = "1.0.0" }
fugit = "0.3"
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
heapless = "0.8"
rp235x-hal = { version = "0.3", features = [
    "rt",
    "critical-section-impl",
    "binary-info",
] }
rtic-sync = "1.4.0"
libm = "0.2"

rust-matrices = {git = "https://github.com/CarlOsterberg/rust-matrices", rev = "db7dd3a" }
controller-radio-interface = {git = "https://github.com/CarlOsterberg/controller-radio-interface", features = ["defmt"], rev = "ebe34a6b5" }

[dependencies.rtic]
version = "2.2.0"
features = ["thumbv8main-backend"]

[dependencies.rtic-monotonics]
version = "2.0.0"
features = ["rp235x"]

# If you're not going to use a Board Support Package you'll need these:

# cargo build/run
[profile.dev]
debug = 2
debug-assertions = true
opt-level = 2
overflow-checks = true

# cargo build/run --release
[profile.release]
debug = 2
debug-assertions = false
lto = 'fat'
opt-level = 2
overflow-checks = false

# do not optimize proc-macro crates = faster builds from scratch
[profile.dev.build-override]
debug = false
debug-assertions = false
overflow-checks = false
opt-level = 0

[profile.release.build-override]
debug = false
debug-assertions = false
overflow-checks = false
opt-level = 0

[[bin]]
name = "rp235x-rtic-droner"
test = false
bench = false
